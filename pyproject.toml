[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tomatopgfm"
version = "0.1.0"
description = "Graph-conditioned genomic foundation model for tomato pangenomes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "torch>=2.1",
  "safetensors>=0.4",
]

[project.scripts]
tomatopgfm = "tomatopgfm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
